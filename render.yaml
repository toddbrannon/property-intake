# Render Blueprint: one web service + one 1 GB persistent disk.
# In Render: New -> Blueprint -> pick this repo -> Apply.
services:
  - type: web
    name: property-intake
    runtime: python
    plan: starter            # $7/mo; a persistent disk requires a paid plan
    region: ohio             # or oregon / virginia; keep it in the US
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: intake-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: INBOX_DIR
        value: /var/data/inbox
      - key: DONE_DIR
        value: /var/data/done
      - key: FAILED_DIR
        value: /var/data/failed
      - key: OUTPUT_DIR
        value: /var/data/output
      - key: POLL_SECONDS
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false            # Render asks you for this at deploy time; leave blank for samples-only
      - key: APP_PASSWORD
        sync: false            # a password for the page; leave blank for no password
